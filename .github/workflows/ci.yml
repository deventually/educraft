name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "26.13.0", cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check
  audit:
    # Known vulnerabilities in dependencies. Production must be clean from moderate up; the whole
    # tree (dev tools too) blocks from high. npm audit reads the lockfile only, no install needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "26.13.0" }
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=high
  e2e:
    # Browser tests: the production build in Chromium, with axe (WCAG 2.2 AA) and CSP checks.
    # Temporarily off on GitHub (BESLUIT-2026-11-11-9): the runner could not install Chromium.
    # Run `npm run test:e2e` locally and put the result in the PR. Switch it back on with the
    # repository variable E2E_IN_CI=true (Settings > Secrets and variables > Actions > Variables).
    # A skipped job counts as passed for a required check, so the ruleset can stay as it is.
    if: vars.E2E_IN_CI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "26.13.0", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
