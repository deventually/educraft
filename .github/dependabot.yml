# Weekly update pull requests. Minor and patch updates come bundled in one PR per ecosystem;
# each major version jump gets its own PR, so it can be read and tested on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
